[package]
name = "binius64-general-zk-bench"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1.0.98"
binius-core = { path = "../../implementations/binius64/crates/core" }
binius-frontend = { path = "../../implementations/binius64/crates/frontend" }
binius-hash = { path = "../../implementations/binius64/crates/hash" }
binius-prover = { path = "../../implementations/binius64/crates/prover", default-features = false }
binius-utils = { path = "../../implementations/binius64/crates/utils" }
binius-verifier = { path = "../../implementations/binius64/crates/verifier" }
clap = { version = "4.5", features = ["derive"] }
rand = { version = "0.10.1", features = ["thread_rng"] }
serde_json = "1.0.140"
sha2 = "0.11.0"

tracing = "0.1.38"
libc = "0.2"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
debug = true
